<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Вход | MeowMeow</title>
    <link rel="stylesheet" href="StyleOfProject.css" />
    <link rel="shortcut icon" href="Icons.ico" type="image/x-icon">
</head>

<body>
    <header>
        <div class="container">
            <h1>MeowMeow</h1>
            <nav>
                <a href="News.html">Новости</a>
                <a href="Services.html">Услуги</a>
                <a href="AboutCompany.html">О компании</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <section class="hero_login">
            <h2>Вход в личный кабинет</h2>
        </section>

        <section class="login-form-section">
            <form id="loginForm" class="login-form" novalidate>
                <div class="form-group">
                    <label for="login">Логин</label>
                    <input type="text" id="login" name="login" required maxlength="8">
                </div>

                <div class="form-group">
                    <label for="password">Пароль</label>
                    <input type="password" id="password" name="password" required maxlength="8">
                </div>

                <button type="submit" class="btn-primary">Войти</button>
            </form>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2025 MeowMeow. Все права защищены.</p>
        </div>
    </footer>

    <div id="customModal" class="modal" style="display: none;">
        <div class="modal-content">
            <span class="close">&times;</span>
            <p id="modalMessage"></p>
        </div>
    </div>

    <script src="script.js"></script>

</body>

</html>
