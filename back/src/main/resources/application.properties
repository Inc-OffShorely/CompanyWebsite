server.port=9090

# Секреты и настройки окружения не хранятся в репозитории: они берутся из переменных
# окружения или из файла back/.env (пример - back/.env.example, сам .env в .gitignore)
spring.config.import=optional:file:.env[.properties],optional:file:back/.env[.properties]

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/corporate_portal}
spring.datasource.username=${DB_USERNAME:mm_app}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.default_schema=mm
spring.jpa.open-in-view=false

spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.time-zone=UTC

# Ключ подписи JWT: случайная строка от 32 символов (openssl rand -base64 48)
jwt.secret=${JWT_SECRET}
jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:86400}

app.idle.sweeperMs=5000
app.idle.inactivityMinutes=5
app.idle.confirmationGraceSeconds=15

# Папка, где хранятся загруженные документы
documents.storage.path=${DOCUMENTS_DIR:./documents}
